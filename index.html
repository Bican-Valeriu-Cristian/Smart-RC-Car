<!doctype html>
<html lang="ro">

<head>
    <meta charset="utf-8" />
    <title>Smart RC Car</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>

<body>
    <h1>Smart RC Car</h1>

    <div class="page">
        <section class="panel video-wrap">
            <img src="/video" alt="Flux video" />
            <p id="status">Status...</p>
        </section>

        <section class="panel">
            <h2 class="joy-header">Joystick</h2>
            <p class="telemetry">
                X: <span id="x_coordinate">0</span> &nbsp;
                Y: <span id="y_coordinate">0</span> &nbsp;
                Speed: <span id="speed">0</span> % &nbsp;
                Angle: <span id="angle">0</span>;
                Dist: <span id="distance">--</span> cm;
            </p>

            <canvas id="canvas" name="game"></canvas>
        </section>
    </div>

    <script>
        let canvas, ctx;
        let width, height, radius = 100;
        let x_orig, y_orig;
        let coord = { x: 0, y: 0 };
        let paint = false;

        window.addEventListener('load', () => {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            resize();

            // Mouse
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', Draw);
            document.addEventListener('mouseup', stopDrawing);

            // Touch
            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', Draw, { passive: false });
            document.addEventListener('touchend', stopDrawing);
            document.addEventListener('touchcancel', stopDrawing);

            window.addEventListener('resize', resize);

            resetTelemetry();
        });

        function resize() {
            width = document.querySelector('.panel:last-of-type').clientWidth || window.innerWidth;
            height = radius * 5;

            canvas.width = width;
            canvas.height = height;

            x_orig = width / 2;
            y_orig = height / 3;

            drawBackground();
            drawJoystick(x_orig, y_orig);
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(x_orig, y_orig, radius / 2 + 10, 0, Math.PI * 2, true);
            ctx.fillStyle = '#ECE5E5';
            ctx.fill();
        }

        function drawJoystick(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, radius / 2, 0, Math.PI * 2, true);
            ctx.fillStyle = '#F08080';
            ctx.fill();
            ctx.strokeStyle = '#F6ABAB';
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        function getPosition(event) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (event.touches && event.touches[0]) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else if (event.changedTouches && event.changedTouches[0]) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            coord.x = clientX - rect.left;
            coord.y = clientY - rect.top;
        }

        function isInsideCircle() {
            const dx = coord.x - x_orig;
            const dy = coord.y - y_orig;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance <= radius;
        }

        function startDrawing(event) {
            event.preventDefault?.();
            getPosition(event);
            if (!isInsideCircle()) return;

            paint = true;
            drawBackground();
            drawJoystick(coord.x, coord.y);
            Draw(event);
        }

        // ✅ Trimită STOP indiferent de starea 'paint'
        function stopDrawing() {
            paint = false;
            drawBackground();
            drawJoystick(x_orig, y_orig);
            resetTelemetry();
            if (typeof send === 'function') {
                send(0, 0, 0, 0);
            }
        }

        function Draw(event) {
            if (!paint) return;
            event.preventDefault?.();
            getPosition(event);

            drawBackground();

            const dx = coord.x - x_orig;
            const dy = coord.y - y_orig;

            let angle = Math.atan2(dy, dx);
            let angle_in_degrees = (angle < 0)
                ? Math.round(-angle * 180 / Math.PI)
                : Math.round(360 - angle * 180 / Math.PI);

            const distance = Math.sqrt(dx * dx + dy * dy);

            let x, y;
            if (distance <= radius) {
                x = coord.x; y = coord.y;
            } else {
                x = radius * Math.cos(angle) + x_orig;
                y = radius * Math.sin(angle) + y_orig;
            }

            drawJoystick(x, y);

            const speed = Math.round(100 * Math.sqrt((x - x_orig) ** 2 + (y - y_orig) ** 2) / radius);
            const x_relative = Math.round(x - x_orig);
            const y_relative = Math.round(y - y_orig);

            updateTelemetry(x_relative, y_relative, speed, angle_in_degrees);

            if (typeof send === 'function') {
                send(x_relative, y_relative, speed, angle_in_degrees);
            }
        }

        function updateTelemetry(x, y, speed, angle) {
            document.getElementById("x_coordinate").innerText = x;
            document.getElementById("y_coordinate").innerText = y;
            document.getElementById("speed").innerText = speed;
            document.getElementById("angle").innerText = angle;
        }

        function resetTelemetry() {
            updateTelemetry(0, 0, 0, 0);
        }
    </script>

    <script src="/static/app.js"></script>
</body>

</html>
