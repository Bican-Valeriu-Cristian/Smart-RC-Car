<!doctype html>
<html lang="ro">

<head>
    <meta charset="utf-8" />
    <title>Smart RC Car</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/style.css?v=23">
    <script src="/static/app.js?v=23"></script>
    <style>
        /* Mic fix pentru a preveni selectarea textului accidental pe mobil cand folosesti joystick-ul */
        canvas {
            touch-action: none;
            /* Foarte important pentru Chrome/Safari pe mobil */
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>
    <h1>Smart RC Car</h1>

    <div class="page">
        <section class="panel video-wrap">
            <img src="/video" alt="Flux video" />
            <p id="status">Distanță: ...</p>
        </section>

        <section class="panel">
            <h2 class="joy-header">Joystick</h2>
            <p class="telemetry">
                X: <span id="x_coordinate">0</span> &nbsp;
                Y: <span id="y_coordinate">0</span> &nbsp;
                Speed: <span id="speed">0</span> % &nbsp;
                Angle: <span id="angle">0</span>
            </p>

            <canvas id="canvas" name="game"></canvas>
        </section>
    </div>

    <script>
        var canvas, ctx;

        window.addEventListener('load', () => {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resize();

            // --- Evenimente MOUSE ---
            document.addEventListener('mousedown', startDrawing);
            document.addEventListener('mouseup', stopDrawing);
            document.addEventListener('mousemove', Draw);

            // --- Evenimente TOUCH (Mobil/Tableta) ---
            // 'passive: false' este critic pentru a putea bloca scroll-ul paginii
            document.addEventListener('touchstart', startDrawing, { passive: false });
            document.addEventListener('touchend', stopDrawing);
            document.addEventListener('touchcancel', stopDrawing);
            document.addEventListener('touchmove', Draw, { passive: false });

            window.addEventListener('resize', resize);

            // Failsafe: oprește mașina dacă mouse-ul părăsește zona sau fereastra pierde focus
            canvas.addEventListener('mouseleave', stopDrawing);
            window.addEventListener('blur', stopDrawing);

            // Resetare vizuală la start
            resetTelemetry();
        });

        // Funcție helper pentru resetarea textului
        function resetTelemetry() {
            document.getElementById("x_coordinate").innerText = 0;
            document.getElementById("y_coordinate").innerText = 0;
            document.getElementById("speed").innerText = 0;
            document.getElementById("angle").innerText = 0;
        }

        var width, height, radius, x_orig, y_orig;

        function resize() {
            width = document.querySelector('.panel:last-of-type').clientWidth || window.innerWidth;
            radius = 100;
            height = radius * 5; // Păstrez proporția ta originală
            ctx.canvas.width = width;
            ctx.canvas.height = height;
            background();
            joystick(width / 2, height / 3);
        }

        function background() {
            x_orig = width / 2;
            y_orig = height / 3;
            ctx.beginPath();
            ctx.arc(x_orig, y_orig, radius / 2 + 10, 0, Math.PI * 2, true);
            ctx.fillStyle = '#ECE5E5';
            ctx.fill();
        }

        function joystick(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, radius / 2, 0, Math.PI * 2, true);
            ctx.fillStyle = '#F08080';
            ctx.fill();
            ctx.strokeStyle = '#F6ABAB';
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        let coord = { x: 0, y: 0 };
        let paint = false;

        function getPosition(event) {
            if (!event) return;

            // Suportă atât mouse cât și touch
            var mouse_x = event.clientX || (event.touches && event.touches[0] ? event.touches[0].clientX : undefined);
            var mouse_y = event.clientY || (event.touches && event.touches[0] ? event.touches[0].clientY : undefined);

            // Actualizăm coordonatele doar dacă avem input valid
            if (mouse_x !== undefined && mouse_y !== undefined) {
                coord.x = mouse_x - canvas.getBoundingClientRect().left;
                coord.y = mouse_y - canvas.getBoundingClientRect().top;
            }
        }

        function is_it_in_the_circle() {
            var current_radius = Math.sqrt(Math.pow(coord.x - x_orig, 2) + Math.pow(coord.y - y_orig, 2));
            return radius >= current_radius;
        }

        function startDrawing(event) {
            // Blochează scroll-ul pe mobil la atingere
            if (event.type === 'touchstart') {
                event.preventDefault();
            }

            paint = true;
            getPosition(event);

            if (is_it_in_the_circle()) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                background();
                joystick(coord.x, coord.y);
                // Apelăm Draw pentru a trimite datele imediat, pasând evenimentul
                Draw(event);
            }
        }

        function stopDrawing() {
            paint = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            background();
            joystick(width / 2, height / 3);
            resetTelemetry();

            // Verificăm dacă funcția send există înainte de a o apela
            if (typeof send === "function") {
                send(0, 0, 0, 0);
            }
        }

        function Draw(event) {
            if (paint) {
                // Blochează scroll-ul pe mobil la mișcare
                if (event.type === 'touchmove') {
                    event.preventDefault();
                }

                // [IMPORTANT] Actualizăm poziția ÎNAINTE de calcule
                getPosition(event);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                background();

                var angle_in_degrees, x, y, speed;
                var angle = Math.atan2((coord.y - y_orig), (coord.x - x_orig));

                if (Math.sign(angle) == -1) {
                    angle_in_degrees = Math.round(-angle * 180 / Math.PI);
                } else {
                    angle_in_degrees = Math.round(360 - angle * 180 / Math.PI);
                }

                if (is_it_in_the_circle()) {
                    joystick(coord.x, coord.y);
                    x = coord.x;
                    y = coord.y;
                } else {
                    x = radius * Math.cos(angle) + x_orig;
                    y = radius * Math.sin(angle) + y_orig;
                    joystick(x, y);
                }

                // Calcul viteză (max 100%)
                var speed = Math.round(100 * Math.sqrt(Math.pow(x - x_orig, 2) + Math.pow(y - y_orig, 2)) / radius);
                if (speed > 100) speed = 100;

                var x_relative = Math.round(x - x_orig);
                var y_relative = Math.round(y - y_orig);

                // Actualizare UI
                document.getElementById("x_coordinate").innerText = x_relative;
                document.getElementById("y_coordinate").innerText = y_relative;
                document.getElementById("speed").innerText = speed;
                document.getElementById("angle").innerText = angle_in_degrees;

                // Trimitere date către server (Raspberry Pi)
                if (typeof send === "function") {
                    send(x_relative, y_relative, speed, angle_in_degrees);
                }
            }
        }
    </script>


</body>

</html>
